[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cognex-discovery"
version = "0.1.0"
description = "A Tkinter desktop tool for discovering Cognex devices over UDP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
keywords = ["cognex", "discovery", "udp", "tkinter", "machine-vision"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Networking",
]

[project.optional-dependencies]
dev = ["build>=1.2", "ruff>=0.9"]

[project.gui-scripts]
cognex-discovery = "cognex_discovery.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
